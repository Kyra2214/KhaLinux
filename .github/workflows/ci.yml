name: KhaLinux CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khalinux-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host checks and native PTY
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential proot qemu-user-static

      - name: Validate RootFS configuration and shell syntax
        run: |
          python3 distribution/scripts/test-build-config.py
          bash -n distribution/scripts/build-rootfs.sh
          bash -n distribution/scripts/verify-rootfs.sh
          bash -n distribution/scripts/test-rootfs.sh
          bash -n distribution/scripts/test-proot-runtime.sh

      - name: Validate architecture, output buffer and JNI PTY
        run: python3 android/app/validate-phase3.py

      - name: Smoke test ARM64 RootFS with host PRoot and device binds
        run: bash distribution/scripts/test-proot-runtime.sh

  android-build:
    name: Android debug compilation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Run runtime unit tests
        run: gradle --no-daemon :android:runtime:testDebugUnitTest :android:app:testDebugUnitTest

      - name: Compile debug APK
        run: gradle --no-daemon :android:app:assembleDebug

      - name: Upload debug APK for CI inspection
        uses: actions/upload-artifact@v4
        with:
          name: khalinux-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
