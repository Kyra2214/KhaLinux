name: KhaLinux CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, plan/area-red-wifi-publico, recovery/red-portal-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khalinux-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host checks and native PTY
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential proot qemu-user-static

      - name: Validate RootFS configuration and shell syntax
        run: |
          python3 distribution/scripts/test-build-config.py
          bash -n distribution/scripts/build-rootfs.sh
          bash -n distribution/scripts/verify-rootfs.sh
          bash -n distribution/scripts/test-rootfs.sh
          bash -n distribution/scripts/test-proot-runtime.sh

      - name: Static security audit (Phase 9.1)
        run: python3 distribution/scripts/audit-security.py

      - name: Validate JNI PTY on the host
        run: bash android/runtime/test-pty-native.sh

      - name: Smoke test ARM64 RootFS with host PRoot and device binds
        run: bash distribution/scripts/test-proot-runtime.sh

  android-tests:
    name: Android unit tests and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper 8.7)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Run runtime unit tests
        run: ./gradlew --no-daemon :android:runtime:testDebugUnitTest :android:app:testDebugUnitTest

      - name: Android lint (debug)
        run: ./gradlew --no-daemon :android:app:lintDebug

  android-release-apk:
    name: Android signed release APK (main)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [host-validation, android-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper 8.7)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KHALINUX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KHALINUX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHALINUX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KHALINUX_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { echo "Secret ausente: $v" >&2; exit 1; }
          done

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KHALINUX_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/khalinux-release.jks"
          echo "KHALINUX_KEYSTORE_PATH=${RUNNER_TEMP}/khalinux-release.jks" >> "${GITHUB_ENV}"

      - name: Build signed, minified release APK
        env:
          KHALINUX_KEYSTORE_PASSWORD: ${{ secrets.KHALINUX_KEYSTORE_PASSWORD }}
          KHALINUX_KEY_ALIAS: ${{ secrets.KHALINUX_KEY_ALIAS }}
          KHALINUX_KEY_PASSWORD: ${{ secrets.KHALINUX_KEY_PASSWORD }}
        run: |
          # versionCode 11 reservado para os artefatos automáticos da main; releases públicas usam > 11.
          ./gradlew --no-daemon :android:app:assembleRelease \
            -PkhalinuxVersionName="1.0.0-main.${GITHUB_RUN_NUMBER}" \
            -PkhalinuxVersionCode=11 \
            -PkhalinuxMinify=true

      - name: Verify signature and create checksummed artifact
        run: |
          set -Eeuo pipefail
          apk="$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*unsigned*' -print -quit)"
          [[ -n "$apk" ]] || { echo "APK release assinado não encontrado" >&2; exit 1; }
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release-out
          name="KhaLinux-main-${GITHUB_SHA:0:7}.apk"
          cp "$apk" "release-out/${name}"
          (cd release-out && sha256sum "$name" > "${name}.sha256")
          cat "release-out/${name}.sha256"

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/khalinux-release.jks"

      - name: Upload signed release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khalinux-release-main-${{ github.run_number }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30
