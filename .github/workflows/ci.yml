name: KhaLinux CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: khalinux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-validation:
    name: Host checks and native PTY
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Validate architecture, output buffer and JNI PTY
        run: python3 android/app/validate-phase3.py

  android-build:
    name: Android debug compilation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"
          yes | sdkmanager --licenses

      - name: Compile debug APK
        run: gradle --no-daemon :android:app:assembleDebug

      - name: Upload debug APK for CI inspection
        uses: actions/upload-artifact@v4
        with:
          name: khalinux-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
