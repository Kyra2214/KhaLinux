name: Build and publish signed release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão semântica (ex.: 1.0.0)'
        required: true
      version_code:
        description: 'versionCode inteiro, maior que o da release anterior'
        required: true
      minify:
        description: 'Ativar R8/minificação (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: khalinux-apk-release
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build, sign, verify and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Entradas passam por variáveis de ambiente (nunca interpoladas direto em scripts).
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      MINIFY: ${{ inputs.minify }}
      APK_TAG: "v${{ inputs.version_name }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and refuse to reuse an existing tag
        run: |
          [[ "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "version_name inválida" >&2; exit 1; }
          [[ "${VERSION_CODE}" =~ ^[0-9]+$ ]] || { echo "version_code inválido" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/${APK_TAG}" >/dev/null 2>&1; then
            echo "A tag ${APK_TAG} já existe; releases são imutáveis." >&2
            exit 1
          fi

      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.KHALINUX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KHALINUX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KHALINUX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KHALINUX_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!v}" ]] || { echo "Secret ausente: $v (ver docs/release.md)" >&2; exit 1; }
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (wrapper 8.7)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Static security audit
        run: python3 distribution/scripts/audit-security.py

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KHALINUX_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/khalinux-release.jks"
          echo "KHALINUX_KEYSTORE_PATH=${RUNNER_TEMP}/khalinux-release.jks" >> "${GITHUB_ENV}"

      - name: Build signed release APK
        env:
          KHALINUX_KEYSTORE_PASSWORD: ${{ secrets.KHALINUX_KEYSTORE_PASSWORD }}
          KHALINUX_KEY_ALIAS: ${{ secrets.KHALINUX_KEY_ALIAS }}
          KHALINUX_KEY_PASSWORD: ${{ secrets.KHALINUX_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :android:app:assembleRelease \
            -PkhalinuxVersionName="${VERSION_NAME}" \
            -PkhalinuxVersionCode="${VERSION_CODE}" \
            -PkhalinuxMinify="${MINIFY}"

      - name: Verify signature, name the artifact and hash it
        run: |
          set -Eeuo pipefail
          apk="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          [[ "$apk" != *unsigned* ]] || { echo "APK não assinado: $apk" >&2; exit 1; }
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release-out
          cp "$apk" "release-out/KhaLinux-${VERSION_NAME}.apk"
          (cd release-out && sha256sum "KhaLinux-${VERSION_NAME}.apk" > "KhaLinux-${VERSION_NAME}.apk.sha256")
          cat release-out/*.sha256

      - name: Remove keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/khalinux-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khalinux-release-apk
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APK_TAG }}
          name: KhaLinux ${{ inputs.version_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-out/*
